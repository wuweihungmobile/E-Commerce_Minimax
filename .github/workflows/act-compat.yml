# =============================================
# Local CI (act-compatible)
# AISDLC v0.09 - Stage 8 Development Preparation
# 用途：本機使用 act 工具模擬 GitHub Actions CI 流程，亦作為雲端 push 的完整驗證
# 執行：act -W .github/workflows/act-compat.yml
# =============================================
# 重點修正：
#   1. 移除 act 不支援的 GitHub 專屬 actions
#      - gitleaks-action
#      - dependency-review-action
#      - setup-java cache (本機無需)
#   2. Redis 改用 image-level 設定
#   3. PostgreSQL 改用 postgres:18-alpine（與 docker-compose 一致）
#   4. 不需要 secrets, GITHUB_TOKEN 等
#   5. backend-unit 先跑；backend-integration 與 frontend 皆只依賴 backend-unit，
#      雲端上可平行執行（各自獨立 runner，無 OOM 疑慮）
# =============================================

name: Local CI (act-compatible)

# 🔴 2026-07-04：重新啟用 push（僅 main）。背景：
#   - 2026-06-30 曾為省 private repo Actions 額度改成僅 workflow_dispatch，push 完全不上雲端，
#     但代價是「完整測試程序」全部壓在本地 4 核/8GB 機器跑 pre-push（25-35 分鐘、有 OOM 風險）。
#   - push 頻率已受控（commit 勤、push 以 Sprint 收尾為單位，非当初帳單出事時的高頻重推），
#     加上本地已先跑過輕量守門（backend-unit + validate-schema + frontend lint/type-check），
#     雲端這次 push 大概率一次過，帳單風險應遠低於 2026-05 那次 20+ 次失敗重推。
#   - 本檔不含部署 job（deploy-staging/production 在 ci.yml，未重新啟用 push，維持手動觸發)。
# 本地 act 以 `act -W .github/workflows/act-compat.yml` 指定單檔執行，會無視 on: 事件過濾，不受影響。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: local-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  COVERAGE_THRESHOLD: 80

jobs:
  # =============================================
  # Backend Unit：checkstyle + compile + surefire 單元測試（不含 failsafe 整合測試）
  # 🔴 2026-07-04 新拆分：本地 pre-push 輕量守門只跑這個 job（約 5-8 分鐘）；
  #    完整的 failsafe 整合測試（backend-integration）交給雲端跑，見上方 on: push 說明。
  # =============================================
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: koala
          POSTGRES_PASSWORD: koala5
          POSTGRES_DB: nextkeytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koala -d nextkeytest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 5s

      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: redis-dev-password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a redis-dev-password --no-auth-warning ping | grep -q PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 5s

    env:
      SPRING_PROFILES_ACTIVE: integration-test
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nextkeytest
      SPRING_DATASOURCE_USERNAME: koala
      SPRING_DATASOURCE_PASSWORD: koala5
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis-dev-password
      REDIS_PASSWORD: redis-dev-password
      JWT_SECRET: testSecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLongForTesting
      JWT_ACCESS_TOKEN_EXPIRATION: 900000
      JWT_REFRESH_TOKEN_EXPIRATION: 2592000000
      SPRING_TEST_ENV: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      # 🔴 catthehacker/ubuntu:act-latest 預設沒有 mvn / psql / redis-cli，需手動安裝
      # 🔴 使用 sudo 確保有足夠權限（act 容器環境需要）
      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq maven postgresql-client redis-tools
          mvn --version
          psql --version
          redis-cli --version

      - name: Checkstyle (Backend)
        run: |
          cd backend
          mvn checkstyle:check

      - name: Verify Service Connections
        run: |
          echo "=== Test PostgreSQL ==="
          PGPASSWORD=koala5 psql -h localhost -U koala -d nextkeytest -c "SELECT 1;" || exit 1
          echo "=== Test Redis ==="
          redis-cli -h localhost -a redis-dev-password --no-auth-warning ping | grep -q PONG || exit 1
          echo "All services are healthy"

      - name: Reset Database (Avoid duplicate key errors)
        run: |
          echo "=== Resetting Database ==="
          PGPASSWORD=koala5 psql -h localhost -U koala -d postgres -c "DROP DATABASE IF EXISTS nextkeytest;"
          PGPASSWORD=koala5 psql -h localhost -U koala -d postgres -c "CREATE DATABASE nextkeytest;"
          echo "=== Database Reset Complete ==="

      - name: Compile Backend
        run: |
          cd backend
          mvn clean compile -DskipTests -q

      # Unit tests（Surefire 自動排除 E2E/Integration）
      - name: Run Unit Tests
        run: |
          cd backend
          mvn test -Dspring.profiles.active=test -q
        continue-on-error: false

  # =============================================
  # Backend Integration：failsafe 整合測試 + package（不含在本地 pre-push 輕量守門內）
  # 🔴 2026-07-04 新拆分：這個 job 較慢（約 20-25 分鐘，41 支整合測試類別每支重啟 Spring
  #    Context），本地不再於 pre-push 跑，改由雲端 push 觸發時執行。需要本地驗證時仍可手動：
  #    act -W .github/workflows/act-compat.yml -j backend-integration
  # =============================================
  backend-integration:
    name: Backend Integration Tests & Package
    runs-on: ubuntu-latest
    # Sprint 101（2026-09-01）25 → 45：整合測試套件已成長到 30 個類別 / 392 個測試，
    # 本地（Apple Silicon）整合測試執行 14.4 分，雲端 ubuntu-latest 約慢一倍，
    # 加上 setup/compile 實測需 ~34 分。原本的 25 分預算在 run 33466882327 被撞穿
    # （25m19s 遭 cancel，步驟 1-8 全綠、無任何測試失敗，純粹是預算不足）。
    # 45 分留約 30% 餘裕；仍保留上限以便捕捉真正的 hang，勿改成 GitHub 預設的 360。
    # 執行時間持續成長的結構性問題另記於 DEFERRED_ITEMS_TRACKER 的 DEF-049。
    timeout-minutes: 45
    needs: [backend-unit]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: koala
          POSTGRES_PASSWORD: koala5
          POSTGRES_DB: nextkeytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koala -d nextkeytest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 5s

      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: redis-dev-password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a redis-dev-password --no-auth-warning ping | grep -q PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 5s

    env:
      SPRING_PROFILES_ACTIVE: integration-test
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nextkeytest
      SPRING_DATASOURCE_USERNAME: koala
      SPRING_DATASOURCE_PASSWORD: koala5
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis-dev-password
      REDIS_PASSWORD: redis-dev-password
      JWT_SECRET: testSecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLongForTesting
      JWT_ACCESS_TOKEN_EXPIRATION: 900000
      JWT_REFRESH_TOKEN_EXPIRATION: 2592000000
      SPRING_TEST_ENV: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Install Build Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq maven postgresql-client redis-tools
          mvn --version
          psql --version
          redis-cli --version

      - name: Verify Service Connections
        run: |
          echo "=== Test PostgreSQL ==="
          PGPASSWORD=koala5 psql -h localhost -U koala -d nextkeytest -c "SELECT 1;" || exit 1
          echo "=== Test Redis ==="
          redis-cli -h localhost -a redis-dev-password --no-auth-warning ping | grep -q PONG || exit 1
          echo "All services are healthy"

      - name: Reset Database (Avoid duplicate key errors)
        run: |
          echo "=== Resetting Database ==="
          PGPASSWORD=koala5 psql -h localhost -U koala -d postgres -c "DROP DATABASE IF EXISTS nextkeytest;"
          PGPASSWORD=koala5 psql -h localhost -U koala -d postgres -c "CREATE DATABASE nextkeytest;"
          echo "=== Database Reset Complete ==="

      - name: Compile Backend
        run: |
          cd backend
          mvn clean compile -DskipTests -q

      # Integration + E2E tests（Failsafe 自動只跑 E2E/Integration）
      - name: Run Integration Tests
        run: |
          cd backend
          mvn verify -Dspring.profiles.active=integration-test
        continue-on-error: false

      - name: Package Backend
        run: |
          cd backend
          mvn package -DskipTests

  # =============================================
  # Frontend: Lint + Type Check + Build
  # 🔴 2026-07-04 修正：needs 改回 [backend-unit]（非 backend-integration）。
  #    發現：act 對 `-j <job>` 會遞迴解析並執行整條 needs 鏈——`act -j frontend`
  #    （被 make validate-fast/validate-push 呼叫）因 needs: [backend-integration]
  #    連帶跑了本該只在雲端跑的 backend-integration（25+ 分鐘），完全違背 pre-push
  #    輕量守門的設計初衷（兩次 validate-push 實測皆證實此問題，直到 push 時才發現）。
  #    frontend 與 backend-integration 本無資料依賴，雲端上兩者可平行跑（各自獨立
  #    runner，無 OOM 疑慮），只需都基於 backend-unit 通過即可。
  # =============================================
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-unit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: ESLint
        run: |
          cd frontend
          npm run lint
        continue-on-error: false

      - name: Type Check
        run: |
          cd frontend
          npm run type-check
        continue-on-error: false

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
        continue-on-error: false