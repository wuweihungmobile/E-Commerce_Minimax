name: CI/CD Pipeline (v0.09 Enhanced)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 防止並行 CI 運行導致 artifact 配額問題
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  # Coverage thresholds (AISDLC v0.09 mandatory)
  COVERAGE_THRESHOLD: 80

jobs:
  # =============================================
  # LAYER 0: Security Baseline
  # =============================================

  secret-detection:
    name: Secret Detection (Layer 0)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG_PATH: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  dependency-scan:
    name: Dependency Scan (Layer 0 - SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub Native Dependency Review (replaces OWASP Maven plugin)
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          comment-summary-in-pr: on-failure
        continue-on-error: true

      # Frontend: npm audit (supplementary check)
      - name: Run npm audit (Frontend)
        run: |
          cd frontend
          npm audit --audit-level=high
        continue-on-error: true

  license-compliance:
    name: License Compliance (Layer 0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Backend: License Check
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: License Compliance Check (Backend)
        run: |
          cd backend
          mvn license/license:check || true
        continue-on-error: true

      # Frontend: License Check
      - name: Check Frontend Licenses
        run: |
          cd frontend
          npx license-checker --csv --out frontend-licenses.csv || true
        continue-on-error: true

  # =============================================
  # LAYER 1: Build & Verify
  # =============================================

  backend:
    name: Backend Build & Test (Layer 1)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # 🔴 與 docker-compose.yml 完全一致：postgres:18-alpine
        image: postgres:18-alpine
        env:
          POSTGRES_USER: koala
          POSTGRES_PASSWORD: koala5
          POSTGRES_DB: nextkeytest
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koala -d nextkeytest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

      redis:
        # 🔴 與 docker-compose.yml 完全一致：redis:7-alpine
        # 🔴 修正：使用 env 傳遞密碼（避免 unknown flag 錯誤）
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: redis-dev-password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a redis-dev-password --no-auth-warning ping | grep -q PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

    env:
      SPRING_PROFILES_ACTIVE: integration-test
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nextkeytest
      SPRING_DATASOURCE_USERNAME: koala
      SPRING_DATASOURCE_PASSWORD: koala5
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis-dev-password
      REDIS_PASSWORD: redis-dev-password
      JWT_SECRET: ci-test-secret-key-must-be-at-least-256-bits-long-for-hs256-algo
      JWT_ACCESS_TOKEN_EXPIRATION: 900000
      JWT_REFRESH_TOKEN_EXPIRATION: 2592000000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # 🔴 Ubuntu latest沒有 redis-cli / psql，需手動安裝
      - name: Install Redis + PostgreSQL clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-tools postgresql-client

      # 🔴 新增：先確認服務連線正常
      - name: Verify Service Connections
        run: |
          echo "=== Test PostgreSQL ==="
          PGPASSWORD=koala5 psql -h localhost -U koala -d nextkeytest -c "SELECT 1;" || exit 1
          echo "=== Test Redis ==="
          redis-cli -a redis-dev-password --no-auth-warning ping

      # Layer 1: Checkstyle - 嚴格模式
      - name: Checkstyle (Backend)
        run: |
          cd backend
          mvn checkstyle:check

      # Layer 1: Compile
      - name: Build Backend
        run: |
          cd backend
          mvn clean compile -DskipTests -q

      # Layer 1: Unit Test
      - name: Run Backend Tests
        run: |
          cd backend
          mvn test -Dspring.profiles.active=integration-test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nextkeytest
          SPRING_DATASOURCE_USERNAME: koala
          SPRING_DATASOURCE_PASSWORD: koala5

      # Layer 1: Coverage Gate
      - name: Verify Coverage Gate
        run: |
          cd backend
          mvn jacoco:check
        continue-on-error: true

      # Layer 1: Package
      - name: Package Backend
        run: |
          cd backend
          mvn package -DskipTests

  frontend:
    name: Frontend Build & Test (Layer 1)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      # Layer 1: Lint + Format Check (Frontend)
      - name: ESLint
        run: |
          cd frontend
          npm run lint

      # Layer 1: Type Check
      - name: Type Check
        run: |
          cd frontend
          npm run type-check

      # Layer 1: Build
      - name: Build Frontend
        run: |
          cd frontend
          npm run build
          if [ ! -d ".next" ]; then
            echo "ERROR: .next directory not found after build!"
            ls -la
            exit 1
          fi
          echo "Build completed, .next exists:"
          ls -la .next/

  # =============================================
  # SAST: Static Application Security Testing
  # =============================================
  sast:
    name: SAST (Static Analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Backend: SpotBugs
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Run SpotBugs
        run: |
          cd backend
          mvn spotbugs:check || true
        continue-on-error: true

      # Frontend: Semgrep
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: |
            rules:
              - id: typescript-jwt-security
                pattern: |
                  jwt.sign(...)
                message: "JWT signing detected - ensure secure algorithm and secret management"
                severity: WARNING
                languages:
                  - typescript
        continue-on-error: true

  # =============================================
  # E2E Tests (Playwright)
  # =============================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: koala
          POSTGRES_PASSWORD: koala5
          POSTGRES_DB: nextkeytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koala -d nextkeytest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: redis-dev-password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a redis-dev-password --no-auth-warning ping | grep -q PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nextkeytest
      SPRING_DATASOURCE_USERNAME: koala
      SPRING_DATASOURCE_PASSWORD: koala5
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis-dev-password
      REDIS_PASSWORD: redis-dev-password
      JWT_SECRET: e2e-test-secret-key-must-be-at-least-256-bits-long-for-hs256-algo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend for E2E
        run: |
          cd frontend
          npm run build

      - name: Build Backend for E2E
        run: |
          cd backend
          mvn package -DskipTests

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Clean Database
        run: |
          # 🔴 清理 Flyway migration 記錄，讓 Flyway 重新執行 migration
          # 不使用 DROP SCHEMA，避免刪除所有物件
          echo "=== Cleaning Flyway migration history ==="
          PGPASSWORD=koala5 psql -h localhost -U koala -d nextkeytest -c "DELETE FROM flyway_schema_history;" || true
          echo "Flyway migration history cleaned"

      - name: Start Backend
        run: |
          cd backend
          # 🔴 使用明確的 JAR 路徑，避免 shell expansion 問題
          JAR_FILE="target/ecommerce-1.0.0-SNAPSHOT.jar"
          if [ ! -f "$JAR_FILE" ]; then
            echo "ERROR: JAR file not found: $JAR_FILE"
            ls -la target/
            exit 1
          fi
          echo "Starting backend with JAR: $JAR_FILE"
          nohup java -jar "$JAR_FILE" --spring.profiles.active=test > backend.log 2>&1 &
          echo "Backend PID: $!"
          # 🔴 等待一下讓子程序真正啟動
          sleep 3
          if [ -f backend.log ]; then
            echo "=== Backend log (first 20 lines) ==="
            head -20 backend.log
          fi

      - name: Wait for Backend Health
        run: |
          # 🔴 等待 Backend 啟動
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/api/actuator/health 2>/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... attempt $i"
            sleep 2
          done
          echo "=== Backend failed to start ==="
          echo "=== Backend log (last 50 lines) ==="
          if [ -f backend/backend.log ]; then
            tail -50 backend/backend.log
          else
            echo "No backend.log found!"
            echo "=== Check if Java process is running ==="
            ps aux | grep java || echo "No Java process found"
            echo "=== List backend directory ==="
            ls -la backend/
          fi
          exit 1

      - name: Start Frontend
        run: |
          cd frontend
          nohup npm run start > frontend.log 2>&1 &
          echo "Frontend PID: $!"

      - name: Wait for Frontend
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:3000 2>/dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run E2E Tests
        run: |
          cd frontend
          npx playwright test

  # =============================================
  # Deploy to Staging (on merge to main)
  # =============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
        continue-on-error: true

      - name: Deploy to Staging Server
        run: |
          echo "Deploying to staging server..."
          # Add deployment commands here
          # ssh user@staging-server "cd /opt/ecommerce && ./deploy.sh"
        continue-on-error: true

      - name: Health Check
        run: |
          echo "Running health checks..."
          # curl -f https://staging.example.com/health || exit 1
        continue-on-error: true

  # =============================================
  # Deploy to Production (manual)
  # =============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        continue-on-error: true

      - name: Deploy to Production Server
        run: |
          echo "Deploying to production server..."
          # Add deployment commands here
          # ssh user@production-server "cd /opt/ecommerce && ./deploy.sh"
        continue-on-error: true

      - name: Health Check
        run: |
          echo "Running health checks..."
          # curl -f https://production.example.com/health || exit 1
        continue-on-error: true
