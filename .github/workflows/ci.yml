name: CI/CD Pipeline (v0.09 Enhanced)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  # Coverage thresholds (AISDLC v0.09 mandatory)
  COVERAGE_THRESHOLD: 80

jobs:
  # =============================================
  # LAYER 0: Security Baseline
  # =============================================

  secret-detection:
    name: Secret Detection (Layer 0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG_PATH: .gitleaks.toml

  dependency-scan:
    name: Dependency Scan (Layer 0 - SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Backend: Maven Dependency Check
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run OWASP Dependency Check (Backend)
        run: |
          cd backend
          mvn org.owasp:dependency-check-maven:check
        continue-on-error: true

      - name: Upload Backend Dependency Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-dependency-report
          path: backend/target/dependency-check-report.html
          retention-days: 30

      # Frontend: npm audit
      - name: Run npm audit (Frontend)
        run: |
          cd frontend
          npm audit --audit-level=high
        continue-on-error: true

  license-compliance:
    name: License Compliance (Layer 0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Backend: License Check
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: License Compliance Check (Backend)
        run: |
          cd backend
          mvn license/license:check || true
        continue-on-error: true

      # Frontend: License Check
      - name: Check Frontend Licenses
        run: |
          cd frontend
          npx license-checker --csv --out frontend-licenses.csv || true
        continue-on-error: true

      - name: Upload License Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-reports
          path: |
            frontend-licenses.csv
          retention-days: 30

  # =============================================
  # LAYER 1: Build & Verify
  # =============================================

  backend:
    name: Backend Build & Test (Layer 1)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: koala
          POSTGRES_PASSWORD: koala5
          POSTGRES_DB: nextkeytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # Layer 1: Lint + Format Check (Backend)
      - name: Checkstyle (Backend)
        run: |
          cd backend
          mvn checkstyle:check || true

      # Layer 1: Compile
      - name: Build Backend
        run: |
          cd backend
          mvn clean compile -DskipTests

      # Layer 1: Unit Test with Coverage
      - name: Run Backend Tests with Coverage
        run: |
          cd backend
          mvn test -Dspring.profiles.active=test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nextkeytest
          SPRING_DATASOURCE_USERNAME: koala
          SPRING_DATASOURCE_PASSWORD: koala5

      # Layer 1: Coverage Gate
      - name: Verify Coverage Gate
        run: |
          cd backend
          mvn jacoco:check
        continue-on-error: true

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 7

      # Layer 1: Package
      - name: Package Backend
        run: |
          cd backend
          mvn package -DskipTests

      - name: Upload Backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  frontend:
    name: Frontend Build & Test (Layer 1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      # Layer 1: Lint + Format Check (Frontend)
      - name: ESLint
        run: |
          cd frontend
          npm run lint

      # Layer 1: Type Check
      - name: Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      # Layer 1: Unit Test with Coverage
      - name: Run Tests with Coverage
        run: |
          cd frontend
          npm test -- --coverage --coverageThreshold.global.lines=${{ env.COVERAGE_THRESHOLD }}

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

      # Layer 1: Build
      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Upload Frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 7

  # =============================================
  # SAST: Static Application Security Testing
  # =============================================
  sast:
    name: SAST (Static Analysis)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Backend: SpotBugs
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Run SpotBugs
        run: |
          cd backend
          mvn spotbugs:check || true
        continue-on-error: true

      # Frontend: Semgrep
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: |
            rules:
              - id: typescript-jwt-security
                pattern: |
                  jwt.sign(...)
                message: "JWT signing detected - ensure secure algorithm and secret management"
                severity: WARNING
                languages:
                  - typescript

  # =============================================
  # Container Scan (if Docker available)
  # =============================================
  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    if: false  # Enable when Dockerfiles are added
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # =============================================
  # E2E Tests (Playwright)
  # =============================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Download Backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target/

      - name: Download Frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next

      - name: Start Backend
        run: |
          cd backend/target
          java -jar *.jar --spring.profiles.active=test &
          sleep 30

      - name: Start Frontend
        run: |
          cd frontend
          npm run start &
          sleep 15

      - name: Run E2E Tests
        run: |
          cd frontend
          npx playwright test || true

  # =============================================
  # Deploy to Staging (on merge to main)
  # =============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy to Staging Server
        run: |
          echo "Deploying to staging server..."
          # Add deployment commands here
          # ssh user@staging-server "cd /opt/ecommerce && ./deploy.sh"

      - name: Health Check
        run: |
          echo "Running health checks..."
          # curl -f https://staging.example.com/health || exit 1

  # =============================================
  # Deploy to Production (manual)
  # =============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: ./.github/actions/setup-ssh
        with:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Deploy to Production Server
        run: |
          echo "Deploying to production server..."
          # Add deployment commands here
          # ssh user@production-server "cd /opt/ecommerce && ./deploy.sh"

      - name: Health Check
        run: |
          echo "Running health checks..."
          # curl -f https://example.com/health || exit 1
