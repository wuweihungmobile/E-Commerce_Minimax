# Gitleaks Configuration for E-Commerce Platform
# AISDLC v0.09 - Secret Detection Layer 0

[title]
gitleaks.toml

[description]
Gitleaks configuration for detecting secrets in E-Commerce platform

[rules]
[[rules.whitelist]]
description = "Allow localhost references"
match = [
  "localhost:5432",
  "localhost:6379"
]

# AWS Keys
[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
secretGroup = 1

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Key"
regex = '''(?i)(aws_secret_access_key|aws_secret_key|secret_key)\s*[=:]\s*['\"][A-Za-z0-9/+=]{40}['\"]'''

# JWT Tokens
[[rules]]
id = "jwt-token"
description = "JWT Token"
regex = '''eyJ[A-Za-z0-9-_]+\.eyJ[A-Za-z0-9-_]+\.[A-Za-z0-9-_.+/=]*'''

# Database Passwords
[[rules]]
id = "database-password"
description = "Database Password"
regex = '''(?i)(password|passwd|pwd)\s*[=:]\s*['\"][^'\"]{8,}['\"]'''
secretGroup = 1

# Private Keys
[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''

# Generic API Keys
[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api_key|apikey|api-token|auth_token|access_token)\s*[=:]\s*['\"][A-Za-z0-9_-]{16,}['\"]'''

# GitHub Tokens
[[rules]]
id = "github-token"
description = "GitHub Token"
regex = '''gh[pousr]_[A-Za-z0-9_]{36,}'''

# Slack Tokens
[[rules]]
id = "slack-token"
description = "Slack Token"
regex = '''xox[baprs]-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]*'''

[allowlists]
paths = [
  "**/node_modules/**",
  "**/.git/**",
  "**/dist/**",
  "**/build/**",
  "**/target/**",
  "**/coverage/**",
  "**/.m2/**",
  "**/.next/**"
]
