    - human-confirmation.md
    - business-process-validation.md
    - consensus-building.md
    - validation-reporting.md
  
  templates:
    - stakeholder-validation-template.md
    - requirements-confirmation-template.md
    - business-process-validation-template.md
  
  checklists:
    - stakeholder-coverage-checklist.md
    - requirements-validation-checklist.md
    - human-confirmation-checklist.md
    - business-process-validation-checklist.md