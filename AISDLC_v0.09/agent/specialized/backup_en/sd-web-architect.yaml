    - "❌ Ignore accessibility"
    - "❌ Ship unoptimized images"
    - "❌ Forget about older browsers"
    - "❌ Store sensitive data in localStorage"
    - "❌ Ignore SEO requirements"
    - "❌ Skip performance testing"
