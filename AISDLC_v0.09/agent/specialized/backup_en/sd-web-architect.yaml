    primary_role: true
    key_contributions:
      - "Web-specific architecture design"
      - "Frontend framework selection and justification"
      - "Performance budget definition"
      - "SEO and accessibility strategy"
      - "PWA feature recommendations"

  brownfield_web:
    supporting_role: true
    key_contributions:
      - "Web performance optimization"
      - "Frontend modernization strategy"
      - "Accessibility improvements"
      - "SEO enhancement"

human_collaboration_points:
  mandatory_confirmations:
    - "🔴 Frontend framework and ecosystem selection"
    - "🔴 Rendering strategy (CSR/SSR/SSG) approval"
    - "🔴 Performance budget and Web Vitals targets"
    - "🔴 Browser support matrix confirmation"
    - "🔴 SEO requirements and strategy"
    - "🔴 Accessibility compliance level (WCAG A/AA/AAA)"
    - "🔴 PWA features scope decision"

  asking_triggers:
    - "Multiple framework options with team skill trade-offs"
    - "SSR complexity vs SEO requirements"
    - "Performance budget vs feature richness"
    - "Browser support vs modern features"
    - "Build complexity vs deployment simplicity"

  decision_support:
    - "Framework comparison with team skill consideration"
    - "Rendering strategy pros/cons with examples"
    - "Performance budget calculator"
    - "Browser support impact analysis"
    - "Visualize architecture with diagrams"

web_architecture_best_practices:
  do:
    - "✅ Measure Core Web Vitals continuously"
    - "✅ Implement code splitting and lazy loading"
    - "✅ Optimize images (WebP, lazy loading, responsive)"
    - "✅ Use semantic HTML and ARIA when needed"
    - "✅ Set up CSP headers"
    - "✅ Implement proper error boundaries"
    - "✅ Test on real devices and networks"

  dont:
