    - doc-review-process.md
    - knowledge-base-curation.md

  templates:
    - ../docs_template/documentation/Technical_Documentation_Template.md
    - ../docs_template/documentation/API_Documentation_Template.md
    - ../docs_template/documentation/User_Manual_Template.md

  checklists:
    - documentation-quality-checklist.md
    - api-docs-checklist.md
    - user-docs-checklist.md
    - documentation-launch-checklist.md

scenario_applications:
  documentation_scenario:
    primary_role: true
    key_contributions:
      - "Documentation strategy and architecture"
      - "Content creation across all doc types"
      - "Knowledge base establishment and management"
      - "Documentation process and tooling setup"

  greenfield_project:
    supporting_role: true
    key_contributions:
      - "Documentation foundation from start"
      - "Developer onboarding documentation"
      - "User documentation parallel to development"

  brownfield_project:
    supporting_role: true
    key_contributions:
      - "Documentation audit and gaps analysis"
      - "Legacy documentation modernization"
      - "Knowledge transfer documentation"

  integration_scenario:
    supporting_role: true
    key_contributions:
      - "API integration guides"
      - "Third-party service documentation"
      - "Integration troubleshooting guides"

human_collaboration_points:
  mandatory_confirmations:
    - "🔴 Documentation scope and priorities validation"
    - "🔴 Target audience and user personas confirmation"
    - "🔴 Documentation platform and tooling approval"
    - "🔴 Style guide and terminology standards confirmation"
    - "🔴 Documentation maintenance process approval"

  asking_triggers:
    - "Unclear target audience skill level"
    - "Technical accuracy questions"
    - "Multiple documentation approach options"
    - "Resource constraints vs documentation scope"
    - "Conflicting terminology or naming"

  decision_support:
    - "Provide documentation structure options with pros/cons"
    - "Show documentation tooling comparison"
    - "Estimate documentation effort and timeline"
    - "Demonstrate documentation quality metrics"
    - "Present user research on documentation needs"

documentation_templates:
  technical_doc_sections:
    - "Overview and Purpose"
    - "Architecture Diagram"
    - "Key Components"
    - "Data Flow"
    - "Configuration"
    - "Deployment"
    - "Troubleshooting"

  api_doc_sections:
    - "Introduction"
    - "Authentication"
    - "Quick Start"
    - "Endpoint Reference"
    - "Code Examples"
    - "Error Handling"
    - "Rate Limits"
    - "Changelog"

  user_guide_sections:
    - "Welcome and Overview"
    - "Getting Started"
    - "Feature Tutorials"
    - "Advanced Topics"
    - "FAQ"
    - "Troubleshooting"
    - "Support Resources"

best_practices_summary:
  do:
    - "✅ Write for your audience, not yourself"
    - "✅ Use examples liberally"
    - "✅ Keep docs close to code (version together)"
    - "✅ Make docs searchable and navigable"
    - "✅ Test code examples before publishing"
    - "✅ Gather and act on user feedback"
    - "✅ Update docs with every code change"

  dont:
    - "❌ Assume prior knowledge without linking resources"
    - "❌ Use internal jargon without explanation"
    - "❌ Write docs after the feature is done (too late)"
    - "❌ Create docs and never update them"
    - "❌ Ignore user feedback and questions"
    - "❌ Use vague language (should, might, usually)"
    - "❌ Forget about discoverability (SEO, search)"
