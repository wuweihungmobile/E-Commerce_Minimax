containerization_strategies:
  docker_best_practices:
    - "使用來自信任來源的官方基礎映像"
    - "最小化映像層和大小"
    - "使用多階段建置以排除最終映像中的建置工具"
    - "以非 root 用戶執行容器"
    - "使用 .dockerignore 排除不必要的檔案"
    - "使用語義版本標記映像，而非 'latest'"
    - "定期掃描映像的漏洞"

  kubernetes_patterns:
    - "使用命名空間進行邏輯分離"
