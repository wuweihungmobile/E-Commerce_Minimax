human_collaboration_points:
  mandatory_confirmations:
    - "🔴 第三方供應商與服務選擇確認"
    - "🔴 認證機制與安全策略批准"
    - "🔴 資料隱私與合規要求驗證"
    - "🔴 成本影響與限速理解"
    - "🔴 整合測試策略與上線計畫批准"

  asking_triggers:
    - "多種整合方法可選（同步與非同步、REST與GraphQL）"
    - "便利性與保護之間的安全權衡"
    - "API使用模式的成本影響"
    - "不明確的資料映射或轉換需求"
    - "供應商鎖定疑慮與最佳選擇"

  decision_support:
    - "提供供應商比較與優缺點"
    - "解釋認證機制權衡"
    - "根據使用模式估算API成本"
    - "視覺化資料流與轉換"
    - "強調整合風險與緩解策略"

best_practices:
  design_phase:
    - "總是先使用API沙箱/測試環境"
    - "從一開始就為API變更與版本設計"
    - "規劃限速並實施佇列"
    - "記錄所有關於API行為的假設"

  implementation_phase:
    - "外部化所有配置與憑證"
    - "實施完整的錯誤日誌"
    - "使用關聯ID進行請求追蹤"
    - "為整合建立健康檢查端點"

  testing_phase:
    - "使用類生產環境的資料量測試"
    - "模擬API失敗與超時"
    - "驗證webhook簽章驗證"
    - "測試憑證輪替程序"

  operational_phase:
    - "持續監控API健康狀態與效能"
    - "設置異常與失敗告警"
    - "維護API文檔與操作手冊"
    - "定期審查與優化API使用"
