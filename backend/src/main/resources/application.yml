server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: nextkey-ecommerce
  # 刻意不設 spring.main.allow-bean-definition-overriding（預設 false，DEF-313）：
  # 曾為了讓「redisTemplate 重複」的啟動錯誤消失而開成 true，兩個同名 bean 因此靜默互相覆蓋、誰贏取決於註冊順序，
  # 打包成 JAR 後贏的是沒有 JavaTimeModule 的那個，購物車與訂房都回 500。同名 bean 應該在啟動時就失敗。
  cache:
    redis:
      time-to-live: 300000  # 5 minutes (milliseconds)

  datasource:
    url: jdbc:postgresql://192.168.1.133:5432/nextkeytest
    username: koala
    password: koala5
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: '0'

  data:
    redis:
      host: 192.168.1.133
      port: 6379
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://placeholder.local}

  # 真實寄信服務：Google Workspace SMTP（Sprint 209，接上 DEF-252／253）。
  # username 留空表示尚未設定——SmtpEmailSender 靠 spring.mail.username 存在與否決定要不要啟用
  # （@ConditionalOnProperty），留空時完全不建立該 bean，維持 LoggingEmailSender 既有行為
  # （本機開發／CI／既有測試不受影響，含 E2E 從日誌取一次性連結的機制）。
  # password 須為應用程式密碼（App Password），不是登入密碼；該 Google 帳戶需先開啟兩步驟驗證。
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-min-32-chars}
  access-token-expiration: 900000       # 15 minutes
  refresh-token-expiration: 604800000   # 7 days

# Application Configuration
app:
  host: 0.0.0.0
  port: 8080
  # 排程總開關與專屬執行緒池大小（DEF-305；SchedulingConfig）。整合測試 profile 關閉；緊急時可設 APP_SCHEDULING_ENABLED=false
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
    pool-size: ${APP_SCHEDULING_POOL_SIZE:4}
  # 未付款訂單逾時自動取消（DEF-302；使用者 2026-09-29 拍板 24 小時）
  order-timeout:
    unpaid-hours: ${ORDER_UNPAID_TIMEOUT_HOURS:24}
    check-interval-ms: ${ORDER_TIMEOUT_CHECK_INTERVAL_MS:300000}
    initial-delay-ms: ${ORDER_TIMEOUT_INITIAL_DELAY_MS:60000}
    batch-size: ${ORDER_TIMEOUT_BATCH_SIZE:100}
  # 未付款訂房逾時自動取消（DEF-311；使用者 2026-10-01 對建議方案回覆「依照建議」）：新訂房建立時寫入付款期限
  # payment_due_at = 建立時間 + payment-hours；歷史訂房（NULL）永不逾時。stripe-session-hours 是 Stripe Checkout 工作階段
  # 的有效時間：在這段時間內開始過結帳的訂房不取消，以免錢收了、訂房卻已取消。
  booking-timeout:
    payment-hours: ${BOOKING_PAYMENT_TIMEOUT_HOURS:24}
    stripe-session-hours: ${BOOKING_STRIPE_SESSION_HOURS:24}
    check-interval-ms: ${BOOKING_TIMEOUT_CHECK_INTERVAL_MS:300000}
    initial-delay-ms: ${BOOKING_TIMEOUT_INITIAL_DELAY_MS:60000}
    batch-size: ${BOOKING_TIMEOUT_BATCH_SIZE:100}
  cors:
    # 逗號分隔多個前端來源；正式環境以 APP_CORS_ALLOWED_ORIGINS 覆寫（不可用 *，因 allowCredentials=true）
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  mail:
    # 寄件位址：預設沿用 spring.mail.username（一定能通過 Gmail 驗證）。改成其他位址前，
    # 須先在該 Google 帳戶的「設定 → 帳戶與匯入 → 代收郵件」新增並驗證為寄件別名，否則 Gmail
    # 會拒絕寄送或直接改回驗證帳號。
    from: ${SMTP_FROM_ADDRESS:}

# Storage (MinIO/S3)
storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin123}
  bucket: ${STORAGE_BUCKET:media}
  region: ${STORAGE_REGION:us-east-1}
  presigned-expiry: 3600  # seconds

# Payment Gateway (Stripe)
# webhook-secret 留空表示未啟用 signature 驗證（測試模式）
stripe:
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  secret:
    key: ${STRIPE_SECRET_KEY:sk_test_placeholder}

# OAuth（Sprint 153，item 13：real 交換邏輯，client-id/secret 留空表示尚未設定，
# OAuthService 會回 E-1096 而非誤把空字串當真的憑證送給 provider）
oauth:
  google:
    client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
    client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
  github:
    client-id: ${OAUTH_GITHUB_CLIENT_ID:}
    client-secret: ${OAUTH_GITHUB_CLIENT_SECRET:}
  # redirect_uri 允許清單：僅比對 origin（scheme+host+port），逗號分隔多個環境網域
  allowed-redirect-origins: ${OAUTH_ALLOWED_REDIRECT_ORIGINS:http://localhost:3000}

# Logging
logging:
  # 每行日誌帶入請求追蹤 ID（RequestIdFilter 寫入 MDC；請求範圍外顯示為空），使用者回報的 X-Request-ID 可直接 grep
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    root: INFO
    com.nextkey.ecommerce: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Sprint 209：spring-boot-starter-mail 存在即自動註冊 MailHealthIndicator，會對外連
    # SMTP 伺服器做即時連線測試。整體應用健康狀態（k8s/docker healthcheck、部署守門用）
    # 不該因為 Gmail SMTP 短暫不通就整個判定 DOWN——寄信只是輔助功能（忘記密碼／Email 驗證），
    # 不是核心服務；停用後改由 EmailSender.canDeliver()／寄送時的例外處理各自負責。
    mail:
      enabled: false
