server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: nextkey-ecommerce
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:postgresql://192.168.1.133:5432/nextkeytest
    username: koala
    password: koala5
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: '37'

  data:
    redis:
      host: 192.168.1.133
      port: 6379
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://placeholder.local}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-min-32-chars}
  access-token-expiration: 900000       # 15 minutes
  refresh-token-expiration: 604800000   # 7 days

# Application Configuration
app:
  host: 0.0.0.0
  port: 8080
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8080

# Storage (MinIO/S3)
storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin123}
  bucket: ${STORAGE_BUCKET:media}
  region: ${STORAGE_REGION:us-east-1}
  presigned-expiry: 3600  # seconds

# Payment Gateway (Stripe)
# webhook-secret 留空表示未啟用 signature 驗證（測試模式）
stripe:
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# Logging
logging:
  level:
    root: INFO
    com.nextkey.ecommerce: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
