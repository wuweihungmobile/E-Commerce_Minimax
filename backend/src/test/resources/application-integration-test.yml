spring:
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:postgresql://localhost:5432/nextkeytest
    username: koala
    password: koala5
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
        types:
          uuid:
            preferredSqlType: UUID
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  flyway:
    enabled: false

  cache:
    type: simple

  data:
    redis:
      host: localhost
      port: 6379
      password: redis-dev-password

  # 🔴 停用 OAuth2 Resource Server JWK 驗證（避免在 CI 環境連線外部 issuer）
  # 🔴 mock JwtDecoder bean 由 IntegrationTestConfiguration 提供
  security:
    oauth2:
      resourceserver:
        jwt:
          # 不設定 issuer-uri/jwk-set-uri，使用 mock JwtDecoder
          issuer-uri: ""

# 🔴 Mock JwtDecoder bean 由 IntegrationTestConfiguration 提供
jwt:
  secret: testSecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLongForTesting
  access-token-expiration: 1800000
  refresh-token-expiration: 2592000000

app:
  cors:
    allowed-origins: http://localhost:3000
