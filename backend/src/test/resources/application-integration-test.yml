spring:
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:postgresql://localhost:5432/nextkeytest
    username: koala
    password: koala5
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
        types:
          uuid:
            preferredSqlType: UUID

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      password: redis-dev-password

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://placeholder.local

jwt:
  secret: testSecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLongForTesting
  access-token-expiration: 1800000
  refresh-token-expiration: 2592000000

app:
  cors:
    allowed-origins: http://localhost:3000
