# 啟用 JUnit Jupiter 擴充自動偵測，讓 ThreadLocalIsolationExtension 對全部測試生效。
# 這是 reuseForks=true 的前置條件：同一 JVM 依序跑多個測試類別時，
# 必須保證 TenantContext / SecurityContext 兩組 ThreadLocal 不會跨類別洩漏。
# 詳見 com.nextkey.ecommerce.testsupport.ThreadLocalIsolationExtension 的 javadoc。
junit.jupiter.extensions.autodetection.enabled=true
