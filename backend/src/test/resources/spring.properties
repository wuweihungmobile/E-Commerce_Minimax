# Spring TestContext 快取上限（預設 32）。
#
# 為什麼要調低：本專案 51 個整合/E2E 測試類別共有 27 種相異的 context 設定
# （@SpringBootTest/@WebMvcTest × @ActiveProfiles × @AutoConfigureMockMvc ×
#  @Import × @MockBean 集合）。reuseForks=true 後這些 context 會同時被快取在
# 同一個 JVM 裡，而每個 context 各自持有一組 HikariCP 連線池（預設上限 10）。
# 27 × 10 = 270 條連線，遠超過測試用 postgres 的 max_connections=100；
# 加上每個 Spring Boot context 的堆記憶體，2 GB 預設堆也放不下。
#
# 設為 3：最多同時 3 個 context（約 30 條連線），仍讓「相鄰的同設定類別」
# 共用 context——收益主要來自 api/controller 下 12 個設定完全相同且相鄰的類別。
spring.test.context.cache.maxSize=3
