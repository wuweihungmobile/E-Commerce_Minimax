# =============================================
# E-Commerce Platform - Docker Compose (Mock Services)
# AISDLC v0.09 - 開發專注版
# 用途：本機 Mock 服務，模擬外部 API
# 使用方式：docker compose -f docker-compose.yml -f docker-compose.mock.yml up
# =============================================
# 包含：
#   1. Mock Server (Mockoon) - 模擬外部 API
# =============================================
# ⚠️ 移除說明（2026-06-24）：
# local-llm (ghcr.io/ggerganov/llama.cpp) 已移除
# 原因：代碼庫中無任何 LLM 呼叫（backend/frontend 均無引用）
# 若未來需要本地 LLM，須先確認使用場景並更新 DOCKER_POLICY.md
# =============================================

services:
  # =============================================
  # Mock Server (API Mock)
  # 使用 mockoon/cli 提供 OpenAPI 規範的 Mock API
  # 預設 port: 3001
  # 資料來源：mocks/mockoon-data.json
  # =============================================
  mock-server:
    # 🔴 版本已釘定（2026-06-24）
    # 釘定版本：9.7.0（查詢日期：2026-06-24）
    # 升級流程：確認 breaking changes → 更新此 tag → 更新 DOCKER_POLICY.md → 本機驗證 → CI 測試
    # 🔴 AI 禁止修改此 image tag，版本升級需人工確認
    image: mockoon/cli:9.7.0
    container_name: ecommerce-mock-server
    ports:
      - "3001:3001"
    volumes:
      - ./mocks/mockoon-data.json:/data/mockoon-data.json:ro
    # 🔴 加入 -r 自動修復（避免舊版本 JSON 卡在互動式詢問）
    command: ["-d", "/data/mockoon-data.json", "-p", "3001", "-r"]
    restart: unless-stopped
    networks:
      - ecommerce-network
    healthcheck:
      # 🔴 Mockoon 預設沒有 /health 端點，改用根路徑探活
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    platform: ${DOCKER_PLATFORM:-linux/amd64}
