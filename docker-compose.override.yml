# =============================================
# Docker Compose Override (Development)
# AISDLC v0.09 - Stage 8 Development Preparation
# =============================================

# This file is automatically loaded by docker-compose for development
# Usage: docker compose up (automatically loads override)

services:
  # =============================================
  # Frontend Development
  # =============================================
  frontend:
    build:
      target: builder
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v2
    container_name: ecommerce-frontend-dev
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    healthcheck:
      disable: true
    ports:
      - "3000:3000"

  # =============================================
  # Backend Development
  # =============================================
  backend:
    build:
      target: builder
    container_name: ecommerce-backend-dev
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nextkeytest
      - SPRING_DATASOURCE_USERNAME=koala
      - SPRING_DATASOURCE_PASSWORD=koala5
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_FLYWAY_ENABLED=false
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=redis-dev-password
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis-dev-password
      - JAVA_OPTS=-Xdebug -Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=*:5005
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin123
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    command: mvn spring-boot:run -Dmaven.test.skip=true
    healthcheck:
      # 🔴 注意：Spring Boot context path 為 /api，actuator 端點為 /api/actuator/health
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    ports:
      - "8080:8080"
      - "5005:5005"  # Debug port

  # =============================================
  # MinIO Object Storage（按需啟動）
  # =============================================
  # 🔴 按需啟動（2026-06-29）：加入 profile "storage"
  #   - 預設 `docker compose up` / `make up` 不會啟動或下載 MinIO
  #   - 僅在需要媒體上傳功能時啟動：`make up-storage`
  #     或 `docker compose --profile storage up -d`
  #   - 原則：該部署的才部署、該下載的才下載
  #   - backend 未 depends_on minio，故不啟動 MinIO 不影響後端啟動
  # 🔴 版本已釘定（2026-06-24）
  # 釘定版本：RELEASE.2025-09-07T16-13-09Z（查詢日期：2026-06-24）
  # 升級流程：確認 breaking changes → 更新此 tag → 更新 DOCKER_POLICY.md → 本機驗證 → CI 測試
  # 🔴 AI 禁止修改此 image tag，版本升級需人工確認
  minio:
    profiles: ["storage"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ecommerce-minio
    ports:
      - "9000:9000"   # API endpoint
      - "9001:9001"   # Console endpoint
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - ecommerce-network

# =============================================
# Networks（override 顯式宣告，與主檔合併時不會衝突）
# =============================================
networks:
  ecommerce-network:
    driver: bridge

# =============================================
# Volume for Maven cache + MinIO
# =============================================
volumes:
  maven_cache:
  minio_data:
