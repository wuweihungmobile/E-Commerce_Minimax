# =============================================
# E-Commerce Platform - Docker Compose (Production)
# AISDLC v0.09 - Stage 8 Development Preparation
# 本機 = CI = 正式環境一致性保證
# =============================================
# 使用方式：
#   本機開發：docker compose up（會自動合併 docker-compose.override.yml）
#   CI 模擬： docker compose -f docker-compose.yml -f docker-compose.test.yml up
#   正式環境：docker compose -f docker-compose.yml up -d

services:
  # =============================================
  # Frontend Service (Next.js Production)
  # =============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v2}
    container_name: ecommerce-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v2}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    platform: ${DOCKER_PLATFORM:-linux/amd64}

  # =============================================
  # Backend Service (Spring Boot Production)
  # =============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: ecommerce-backend
    command: java -jar /app/application/app.jar
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nextkeytest}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-koala}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-koala5}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      - SPRING_FLYWAY_ENABLED=${SPRING_FLYWAY_ENABLED:-true}
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-redis-dev-password}
      - JWT_SECRET=${JWT_SECRET:-your-256-bit-secret-key-please-change-in-production}
      - JWT_ACCESS_TOKEN_EXPIRATION=900000
      - JWT_REFRESH_TOKEN_EXPIRATION=2592000000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    platform: ${DOCKER_PLATFORM:-linux/amd64}

  # =============================================
  # PostgreSQL Database
  # =============================================
  postgres:
    image: postgres:18-alpine
    container_name: ecommerce-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-koala}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-koala5}
      - POSTGRES_DB=${POSTGRES_DB:-nextkeytest}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=C --lc-ctype=C
    volumes:
      # 🔴 PostgreSQL 18+ 要求：mount 必須在 /var/lib/postgresql（而非 /var/lib/postgresql/data）
      # 容器內部會自動在子目錄管理版本
      - postgres_data:/var/lib/postgresql
      - ./backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-koala} -d ${POSTGRES_DB:-nextkeytest}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    platform: ${DOCKER_PLATFORM:-linux/amd64}

  # =============================================
  # Redis Cache - 使用 command 陣列方式正確設定密碼
  # =============================================
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:-redis-dev-password}"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-redis-dev-password}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - ecommerce-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    platform: ${DOCKER_PLATFORM:-linux/amd64}

# =============================================
# Volumes
# =============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =============================================
# Networks
# =============================================
networks:
  ecommerce-network:
    driver: bridge
